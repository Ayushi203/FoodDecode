# Copy this file to application-secrets.properties (gitignored) and fill in real values.
# Spring Boot loads it via spring.config.import in application.properties.

spring.datasource.url=jdbc:postgresql://localhost:5432/fooddecode
spring.datasource.username=postgres
spring.datasource.password=CHANGE_ME

# Used from Phase 3 (auth). Generate a long random string (32+ chars).
jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# Used from Phase 6 (Gemini). Never commit the real key.
gemini.api-key=CHANGE_ME
gemini.model=gemini-3.6-flash

# Used from Phase 3 (OTP email). Gmail: use an App Password, not your login password.
mail.username=CHANGE_ME
mail.password=CHANGE_ME

open-food-facts.base-url=https://world.openfoodfacts.org

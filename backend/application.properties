spring.application.name=fooddecode
server.port=${SERVER_PORT:8080}

# Local secrets file is gitignored. The example file is safe to commit.
spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fooddecode}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema. Hibernate only checks that entities match the tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail.username:}
spring.mail.password=${mail.password:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

app.cors.allowed-origin=http://localhost:5173
